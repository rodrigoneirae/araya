{% extends 'plantilla/base/base.html' %}
{% load static  %}
{% block content %}
<div class="w-full max-w-4xl mx-auto px-2 sm:px-4">
    <div class="bg-aq-surface border border-aq-border rounded-xl p-4 sm:p-6 shadow-lg">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
            <h1 class="text-xl sm:text-2xl font-bold text-aq-text">Ingreso de Artículos</h1>
            {% include 'components/action_buttons.html' with entity='Articulo' %}
        </div>

        <form id="articuloForm" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Código</label>
                    <div class="flex gap-2">
                        <input type="text" id="codigo" name="codigo" class="flex-1 min-w-0 px-3 py-2 border border-aq-border bg-aq-bg text-aq-text uppercase" placeholder="Escribir código">
                        <button type="button" onclick="abrirListaArticulos()" class="px-3 py-2 bg-aq-border text-aq-text hover:bg-aq-primary hover:text-white" title="Buscar">
                            <i class='bx bx-search'></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Tipo</label>
                    <select id="tipo" name="tipo" class="w-full px-3 py-2 border border-aq-border bg-aq-bg text-aq-text">
                        <option value="">--- Seleccionar Tipo ---</option>
                    </select>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-aq-text mb-1">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="w-full px-3 py-2 border border-aq-border bg-aq-bg text-aq-text">
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Stock Mínimo</label>
                    <input type="number" id="stomin" name="stomin" step="0.01" class="w-full px-3 py-2 border border-aq-border bg-aq-bg text-aq-text">
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Stock Máximo</label>
                    <input type="number" id="stomax" name="stomax" step="0.01" class="w-full px-3 py-2 border border-aq-border bg-aq-bg text-aq-text">
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Unidad de Medida</label>
                    <select id="um" name="um" class="w-full px-3 py-2 border border-aq-border bg-aq-bg text-aq-text">
                        <option value="">--- Seleccionar UM ---</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Proceso</label>
                    <select id="procesos" name="procesos" class="w-full px-3 py-2 border border-aq-border bg-aq-bg text-aq-text">
                        <option value="">--- Seleccionar Proceso ---</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Peso (Kgs)</label>
                    <input type="number" id="peso" name="peso" step="0.01" class="w-full px-3 py-2 border border-aq-border bg-aq-bg text-aq-text">
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Categoría</label>
                    <select id="categoria" name="categoria" class="w-full px-3 py-2 border border-aq-border bg-aq-bg text-aq-text">
                        <option value="">--- Seleccionar Categoría ---</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
{% block extra_js %}
    <script src="{% static 'js/modulos/maestros/articulos.js' %}" data-url="/maestros/maestros/" data-csrf-token="{{ csrf_token }}"></script>
{% endblock %}
