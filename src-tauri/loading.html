<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <style>
        :root {
            --aq-bg: 12 16 20;
            --aq-surface: 22 28 34;
            --aq-text: 230 235 240;
            --aq-muted: 140 150 160;
            --aq-primary: 74 140 90;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(var(--aq-bg));
            font-family: 'Nunito Sans', Roboto, system-ui, sans-serif;
            padding: 1rem;
        }
        .brand { text-align: center; }
        .brand h1 {
            color: rgb(var(--aq-text));
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 0.25rem;
        }
        .brand p {
            color: rgb(var(--aq-muted));
            font-size: 0.8rem;
            font-weight: 300;
        }
        .card {
            margin-top: 2rem;
            background: rgb(var(--aq-surface));
            border: 1px solid rgb(60,70,80);
            border-radius: 0.75rem;
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(var(--aq-primary), 0.2);
            border-top: 3px solid rgb(var(--aq-primary));
            border-radius: 50%;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner-text {
            color: rgb(var(--aq-muted));
            font-size: 0.9rem;
        }
    </style>
    <script>
        const SERVER_URL = 'http://127.0.0.1:1111';
        const HEALTH_URL = SERVER_URL + '/api/health/';
        const CHECK_INTERVAL = 500;
        const MAX_ATTEMPTS = 200;
        let phase = 'server';
        let attempts = 0;

        function updateText(msg) {
            const el = document.querySelector('.spinner-text');
            if (el) el.textContent = msg;
        }

        function poll() {
            if (attempts >= MAX_ATTEMPTS) {
                updateText('Tiempo de espera agotado');
                return;
            }

            if (phase === 'server') {
                fetch(SERVER_URL, { method: 'HEAD', cache: 'no-cache' })
                    .then(() => {
                        phase = 'db';
                        attempts = 0;
                        updateText('Verificando base de datos...');
                        poll();
                    })
                    .catch(() => {
                        attempts++;
                        setTimeout(poll, CHECK_INTERVAL);
                    });
            } else {
                fetch(HEALTH_URL, { method: 'GET', cache: 'no-cache' })
                    .then(res => {
                        if (res.ok) {
                            window.location.href = SERVER_URL;
                        } else {
                            attempts++;
                            setTimeout(poll, CHECK_INTERVAL);
                        }
                    })
                    .catch(() => {
                        attempts++;
                        setTimeout(poll, CHECK_INTERVAL);
                    });
            }
        }

        setTimeout(poll, 500);
    </script>
</head>
<body>
    <div style="display:flex;flex-direction:column;align-items:center;gap:1.25rem;">
        <img src="./desktop-logo.png" alt="Araya" style="height:64px;width:auto;">
        <div class="brand">
            <p>Sistema de Producción</p>
        </div>
        <div class="card">
            <div class="spinner"></div>
            <span class="spinner-text" id="loadMsg">Iniciando servidor...</span>
        </div>
    </div>
</body>
</html>
