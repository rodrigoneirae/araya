{% extends 'plantilla/base/base.html' %}
{% load static %}
{% block extra_css %}
<style>
    .tabulator { border: 1px solid theme(border aq-border); font-size: 0.75rem; }
    .tabulator .tabulator-header { background-color: rgb(var(--aq-surface-2)); color: rgb(var(--aq-text)); }
    .tabulator .tabulator-row:hover { background-color: rgb(var(--aq-surface-2)); }
    .tabulator .tabulator-row:nth-child(even) { background-color: rgb(var(--aq-bg)); }
</style>
{% endblock extra_css %}
{% block content %}
<div id="spinnerInforme" class="hidden">
    <div class="loader-spinner">
        <div class="spinner"></div>
        <p class="text-white text-sm font-medium mt-3">Generando informe...</p>
    </div>
</div>



<div class="h-full w-full mx-auto px-4 py-2">
    <div class="bg-aq-surface border border-aq-border rounded-xl shadow-lg h-full flex flex-col">
        <div class="p-4 border-b border-aq-border">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-aq-text">Resumen OTs</h1>
                <a href="{% url 'home' %}" class="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-500 text-white hover:bg-gray-600" title="Salir">
                    <i class='bx bx-exit text-lg'></i>
                </a>
            </div>
        </div>

        <div class="p-4 border-b border-aq-border">
            <div class="flex flex-wrap gap-3 items-end">
                <div class="min-w-[140px]">
                    <label class="block text-xs text-aq-text/60 mb-1">Fecha Inicio</label>
                    <input type="date" name="fecha_inicio" id="fecha_inicio" class="w-full px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                </div>
                <div class="min-w-[140px]">
                    <label class="block text-xs text-aq-text/60 mb-1">Fecha Fin</label>
                    <input type="date" name="fecha_fin" id="fecha_fin" class="w-full px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                </div>
                <div class="flex gap-1 pb-[1px]">
                    <button type="button" onclick="generarInforme('pdf')" class="btn-gen px-3 py-1.5 text-xs rounded-lg bg-gradient-to-r from-red-600 to-red-500 text-white hover:from-red-700 hover:to-red-600 font-medium shadow-sm hover:shadow-md transition-all duration-150 flex items-center gap-1.5 border border-red-400/20">
                        <i class='bx bxs-file-pdf text-sm'></i> PDF
                    </button>
                    <button type="button" onclick="generarInforme('excel')" class="btn-gen px-3 py-1.5 text-xs rounded-lg bg-gradient-to-r from-emerald-600 to-emerald-500 text-white hover:from-emerald-700 hover:to-emerald-600 font-medium shadow-sm hover:shadow-md transition-all duration-150 flex items-center gap-1.5 border border-emerald-400/20">
                        <i class='bx bx-grid-alt text-sm'></i> Excel
                    </button>
                </div>
            </div>
        </div>

        <div class="p-4 border-b border-aq-border">
            <div class="flex flex-wrap gap-3 items-end">
                <div class="min-w-[140px]">
                    <label class="block text-xs text-aq-text/60 mb-1">N° OT</label>
                    <div class="flex gap-1">
                        <input type="text" id="ot_numero" class="w-full px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-bg text-aq-text" placeholder="Ingrese OT">
                        <button type="button" onclick="abrirModalOT()" class="px-2 py-1.5 rounded-lg bg-aq-primary text-white hover:opacity-85">
                            <i class='bx bx-search'></i>
                        </button>
                    </div>
                </div>
                <div class="min-w-[140px]">
                    <label class="block text-xs text-aq-text/60 mb-1">Fecha OT</label>
                    <input type="text" id="ot_fecha" readonly class="w-full px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-surface-2 text-aq-text">
                </div>
                <div class="min-w-[180px]">
                    <label class="block text-xs text-aq-text/60 mb-1">Encargado</label>
                    <input type="text" id="ot_encargado" readonly class="w-full px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-surface-2 text-aq-text">
                </div>
                <div class="min-w-[180px]">
                    <label class="block text-xs text-aq-text/60 mb-1">Proceso</label>
                    <div class="flex gap-1">
                        <input type="text" id="ot_proceso" readonly class="w-full px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-surface-2 text-aq-text">
                          <button type="button" onclick="generarPDFDetalle()" class="btn-gen px-3 py-1.5 text-xs rounded-lg bg-gradient-to-r from-red-600 to-red-500 text-white hover:from-red-700 hover:to-red-600 font-medium shadow-sm hover:shadow-md transition-all duration-150 flex items-center gap-1.5 border border-red-400/20">
                        <i class='bx bxs-file-pdf text-sm'></i> PDF
                    </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-auto p-4">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <div class="mb-0">
                    <h3 class="text-sm font-semibold text-aq-text mb-2 flex items-center gap-2">
                        <i class='bx bx-package text-aq-primary'></i> Detalle OT
                    </h3>
                    <div id="tablaDetalleOT" class="w-full border border-aq-border rounded-lg" style="min-height: 200px;"></div>
                </div>

                <div class="mb-0">
                    <h3 class="text-sm font-semibold text-aq-text mb-2 flex items-center gap-2">
                        <i class='bx bx-cart text-red-500'></i> Vale Consumo
                    </h3>
                    <div id="tablaValeConsumo" class="w-full border border-aq-border rounded-lg" style="min-height: 200px;"></div>
                </div>

                <div class="mb-0">
                    <h3 class="text-sm font-semibold text-aq-text mb-2 flex items-center gap-2">
                        <i class='bx bx-upload text-emerald-500'></i> Parte Entrada
                    </h3>
                    <div id="tablaParteEntrada" class="w-full border border-aq-border rounded-lg" style="min-height: 200px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
    <script src="{% static 'js/modulos/produccion/informes/resumen_ots.js' %}" data-url="{% url 'produccion:produccion_informe_resumen_ots' %}"></script>
{% endblock %}
