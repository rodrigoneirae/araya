{% extends 'plantilla/base/base.html' %}
{% load static %}
{% block content %}
<div id="spinnerInforme" class="hidden">
    <div class="loader-spinner">
        <div class="spinner"></div>
        <p class="text-white text-sm font-medium mt-3">Generando informe...</p>
    </div>
</div>

<div class="h-full w-full mx-auto px-4 py-2">
    <div class="bg-aq-surface border border-aq-border rounded-xl shadow-lg h-full flex flex-col">
        <div class="p-4 border-b border-aq-border">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-aq-text">Costos por OT</h1>
                <a href="{% url 'home' %}" class="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-500 text-white hover:bg-gray-600" title="Salir">
                    <i class='bx bx-exit text-lg'></i>
                </a>
            </div>
        </div>

        <div class="p-4 border-b border-aq-border">
            <div class="xl:w-2/3">
                <div class="flex flex-wrap gap-3 items-end">
                    <div class="min-w-[200px]">
                        <label class="block text-xs text-aq-text/60 mb-1">OT Desde</label>
                        <div class="flex gap-1">
                            <input type="text" name="ot_desde" id="otDesde" class="flex-1 min-w-0 px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-bg text-aq-text" placeholder="N° OT">
                            <button type="button" onclick="abrirListaOT('desde')" class="w-8 h-8 flex items-center justify-center rounded-lg bg-aq-border text-aq-text hover:bg-aq-primary hover:text-white" title="Buscar OT">
                                <i class='bx bx-search text-sm'></i>
                            </button>
                        </div>
                    </div>
                    <div class="min-w-[200px]">
                        <label class="block text-xs text-aq-text/60 mb-1">OT Hasta</label>
                        <div class="flex gap-1">
                            <input type="text" name="ot_hasta" id="otHasta" class="flex-1 min-w-0 px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-bg text-aq-text" placeholder="N° OT">
                            <button type="button" onclick="abrirListaOT('hasta')" class="w-8 h-8 flex items-center justify-center rounded-lg bg-aq-border text-aq-text hover:bg-aq-primary hover:text-white" title="Buscar OT">
                                <i class='bx bx-search text-sm'></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex gap-1 pb-[1px]">
                        <button type="button" onclick="calcularCostos()" class="btn-gen px-3 py-1.5 text-xs rounded-lg bg-gradient-to-r from-blue-600 to-blue-500 text-white hover:from-blue-700 hover:to-blue-600 font-medium shadow-sm hover:shadow-md transition-all duration-150 flex items-center gap-1.5 border border-blue-400/20">
                            <i class='bx bx-calculator text-sm'></i> Calcular Costos
                        </button>
                        <button type="button" onclick="generarInforme('pdf')" class="btn-gen px-3 py-1.5 text-xs rounded-lg bg-gradient-to-r from-red-600 to-red-500 text-white hover:from-red-700 hover:to-red-600 font-medium shadow-sm hover:shadow-md transition-all duration-150 flex items-center gap-1.5 border border-red-400/20">
                            <i class='bx bxs-file-pdf text-sm'></i> PDF
                        </button>
                        <button type="button" onclick="generarInforme('excel')" class="btn-gen px-3 py-1.5 text-xs rounded-lg bg-gradient-to-r from-emerald-600 to-emerald-500 text-white hover:from-emerald-700 hover:to-emerald-600 font-medium shadow-sm hover:shadow-md transition-all duration-150 flex items-center gap-1.5 border border-emerald-400/20">
                            <i class='bx bx-grid-alt text-sm'></i> Excel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-auto min-h-0 p-4">
            <div class="overflow-x-auto min-w-0">
                <table class="w-full border-collapse min-w-[900px]">
                    <thead>
                        <tr class="bg-aq-surface-2 text-aq-text text-xs">
                            <th class="px-2 py-2 text-left whitespace-nowrap">OT</th>
                            <th class="px-2 py-2 text-left whitespace-nowrap">Fecha</th>
                            <th class="px-2 py-2 text-left whitespace-nowrap">Proceso</th>
                            <th class="px-2 py-2 text-left whitespace-nowrap">Código</th>
                            <th class="px-2 py-2 text-left whitespace-nowrap">Artículo</th>
                            <th class="px-2 py-2 text-right whitespace-nowrap">Cantidad</th>
                            <th class="px-2 py-2 text-right whitespace-nowrap">PUnit</th>
                            <th class="px-2 py-2 text-right whitespace-nowrap">Neto</th>
                            <th class="px-2 py-2 text-right whitespace-nowrap">Total</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCostos">
                        <tr><td colspan="9" class="text-center text-aq-muted text-sm py-8">Seleccione un rango de OT y presione "Calcular Costos"</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/modulos/produccion/ot/costos_ot.js' %}" data-url="{% url 'produccion:produccion_calculo_ot' %}"></script>
{% endblock %}
