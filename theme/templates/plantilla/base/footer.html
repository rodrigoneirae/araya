{% block footer %}
    <footer class="w-full border-t border-aq-border bg-aq-surface">
        <div class="w-full px-4 py-3">
            <div class="flex items-center justify-between gap-3 text-xs text-aq-muted">
                <div class="whitespace-nowrap">
                    {% now "d-m-Y" %}
                </div>
                <div class="min-w-0 flex-1 text-center whitespace-nowrap truncate">
                    Araya Ltda. 
                    <span id="platform-badge" class="text-aq-muted">[...]</span>
                </div>
                <div class="whitespace-nowrap text-right">
                   Version: {{ APP_VERSION}}
                </div>
            </div>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var badge = document.getElementById('platform-badge');
            if (window.__TAURI__) {
                badge.textContent = '[Tauri]';
                badge.className = 'text-aq-primary font-semibold';
            } else {
                badge.textContent = '[Web]';
                badge.className = 'text-aq-muted';
            }
        });
    </script>
{% endblock %}
