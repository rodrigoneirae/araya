{% extends 'plantilla/base/base.html' %}
{% load static  %}
{% block content %}
<div class="w-full max-w-4xl mx-auto px-2 sm:px-4">
    <div class="bg-aq-surface border border-aq-border rounded-xl p-4 sm:p-6 shadow-lg">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
            <h1 class="text-xl sm:text-2xl font-bold text-aq-text">Ingreso de Artículos</h1>
            <div class="flex gap-2">
                <button type="button" id="btnNuevo" onclick="nuevoArticulo()" class="w-10 h-10 flex items-center justify-center rounded-full bg-aq-primary text-white hover:opacity-85" title="Nuevo">
                    <i class='bx bx-plus text-xl'></i>
                </button>
                <button type="button" id="btnGuardar" onclick="guardarArticulo()" class="w-10 h-10 flex items-center justify-center rounded-full bg-aq-primary text-white hover:opacity-85 hidden" title="Guardar">
                    <i class='bx bx-save text-xl'></i>
                </button>
                <button type="button" id="btnEditar" onclick="editarArticulo()" class="w-10 h-10 flex items-center justify-center rounded-full bg-amber-500 text-white hover:opacity-85 hidden" title="Editar">
                    <i class='bx bx-edit text-xl'></i>
                </button>
                <button type="button" id="btnEliminar" onclick="eliminarArticulo()" class="w-10 h-10 flex items-center justify-center rounded-full bg-red-500 text-white hover:bg-red-600 hidden" title="Eliminar">
                    <i class='bx bx-trash text-xl'></i>
                </button>
                <a href="{% url 'home' %}" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-500 text-white hover:opacity-85 p-2" title="Salir">
                    <i class='bx bx-exit text-lg'></i>
                </a>
            </div>
        </div>

        <form id="articuloForm" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Código</label>
                    <div class="flex gap-2">
                        <input type="text" id="codigo" name="codigo" class="flex-1 min-w-0 px-3 py-2 rounded-lg border border-aq-border bg-aq-bg text-aq-text uppercase" placeholder="Escribir código">
                        <button type="button" onclick="abrirListaArticulos()" class="px-3 py-2 rounded-lg bg-aq-border text-aq-text hover:bg-aq-primary hover:text-white" title="Buscar">
                            <i class='bx bx-search'></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Tipo</label>
                    <select id="tipo" name="tipo" class="w-full px-3 py-2 rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                        <option value="">--- Seleccionar Tipo ---</option>
                    </select>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-aq-text mb-1">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="w-full px-3 py-2 rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Stock Mínimo</label>
                    <input type="number" id="stomin" name="stomin" step="0.01" class="w-full px-3 py-2 rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Stock Máximo</label>
                    <input type="number" id="stomax" name="stomax" step="0.01" class="w-full px-3 py-2 rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Unidad de Medida</label>
                    <select id="um" name="um" class="w-full px-3 py-2 rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                        <option value="">--- Seleccionar UM ---</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-aq-text mb-1">Proceso</label>
                    <select id="procesos" name="procesos" class="w-full px-3 py-2 rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                        <option value="">--- Seleccionar Proceso ---</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Modal Confirmar Eliminación -->
<div id="modalConfirmar" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-aq-surface border border-aq-border rounded-xl w-full max-w-md p-4 sm:p-6 shadow-xl">
        <div class="text-center">
            <div class="w-12 h-12 sm:w-16 sm:h-16 mx-auto mb-4 rounded-full bg-red-100 flex items-center justify-center">
                <i class='bx bx-trash text-xl sm:text-2xl text-red-500'></i>
            </div>
            <h3 class="text-lg sm:text-xl font-bold text-aq-text mb-2">Confirmar Eliminación</h3>
            <p class="text-sm sm:text-base text-aq-muted mb-6">¿Está seguro de eliminar el artículo "<span id="eliminarCodigo" class="font-semibold"></span>"?</p>
            <div class="flex gap-3 justify-center">
                <button onclick="cerrarConfirmar()" class="px-4 py-2 rounded-lg border border-aq-border text-aq-text hover:bg-aq-surface-2">
                    Cancelar
                </button>
                <button onclick="confirmarEliminar()" class="px-4 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600">
                    Eliminar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Lista Artículos -->
<div id="modalArticulos" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-aq-surface border border-aq-border rounded-xl w-full max-w-lg sm:max-w-3xl max-h-[90vh] flex flex-col shadow-xl">
        <div class="flex justify-between items-center p-4 border-b border-aq-border">
            <div class="flex items-center gap-2">
                <h2 class="text-lg sm:text-xl font-bold text-aq-text">Lista de Artículos</h2>
                <button onclick="recargarArticulos()" class="p-2 rounded-lg text-aq-muted hover:text-aq-primary hover:bg-aq-surface-2" title="Actualizar">
                    <i class='bx bx-refresh text-xl'></i>
                </button>
            </div>
            <button onclick="cerrarListaArticulos()" class="text-aq-muted hover:text-aq-text">
                <i class='bx bx-x text-2xl'></i>
            </button>
        </div>
        <div class="p-4 overflow-auto flex-1 min-h-0">
            <input type="text" id="filtroArticulos" onkeyup="filtrarArticulos()" class="w-full px-3 py-2 rounded-lg border border-aq-border bg-aq-bg text-aq-text mb-4" placeholder="Buscar...">
            <div class="overflow-x-auto">
                <table class="w-full text-sm min-w-[250px]">
                    <thead class="bg-aq-surface-2 sticky top-0">
                        <tr>
                            <th class="px-3 py-2 text-left text-aq-text font-semibold whitespace-nowrap">Código</th>
                            <th class="px-3 py-2 text-left text-aq-text font-semibold whitespace-nowrap">Nombre</th>
                            <th class="px-3 py-2 text-left text-aq-text font-semibold whitespace-nowrap">Tipo</th>
                        </tr>
                    </thead>
                    <tbody id="tablaArticulos" class="divide-y divide-aq-border"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>


{% endblock %}
{% block extra_js %}
    <script src="{% static 'js/modulos/maestros/articulos.js' %}" data-url="/maestros/maestros/" data-csrf-token="{{ csrf_token }}"></script>
{% endblock %}
