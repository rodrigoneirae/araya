{% extends 'plantilla/base/base.html' %}
{% load static %}

{% block content %}
<div class="h-full w-full mx-auto px-4 py-2">
    <div class="bg-aq-surface border border-aq-border rounded-xl shadow-lg h-full flex flex-col">
        <div class="p-4 border-b border-aq-border">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-aq-text">Auxiliar de existencia por artículo</h1>
                <a href="{% url 'home' %}" class="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-500 text-white hover:bg-gray-600" title="Salir">
                    <i class='bx bx-exit text-lg'></i>
                </a>
            </div>
        </div>

        <div class="p-4 border-b border-aq-border">
            <div class="xl:w-1/2">
                <div class="flex flex-wrap gap-2 items-end">
                    <div class="flex-1 min-w-[130px]">
                        <div class="flex gap-1">
                            <input type="text" id="auxArtCod" class="flex-1 min-w-0 px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-bg text-aq-text" placeholder="Código">
                            <button type="button" onclick="abrirListaArticulos()" class="px-2 py-1.5 rounded-lg bg-aq-border text-aq-text hover:bg-aq-primary hover:text-white text-sm" title="Buscar">
                                <i class='bx bx-search'></i>
                            </button>
                        </div>
                    </div>
                    <div class="min-w-[140px] flex-1">
                        <span id="auxArtNombre" class="block px-2 py-1.5 text-sm rounded-lg border border-dashed border-aq-border text-aq-text/60 truncate min-h-[36px] leading-[22px]">&nbsp;</span>
                    </div>
                    <div class="w-[60px]">
                        <span id="auxArtUM" class="block px-2 py-1.5 text-sm rounded-lg border border-dashed border-aq-border text-aq-text/60 text-center min-h-[36px] leading-[22px]">&nbsp;</span>
                    </div>
                    <div>
                        <input type="date" id="auxFechaDesde" class="px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                    </div>
                    <div>
                        <input type="date" id="auxFechaCorte" class="px-2 py-1.5 text-sm rounded-lg border border-aq-border bg-aq-bg text-aq-text">
                    </div>
                    <div class="flex gap-1">
                        <button type="button" onclick="generarPDF()" class="px-3 py-1.5 text-xs rounded-lg bg-gradient-to-r from-red-600 to-red-500 text-white hover:from-red-700 hover:to-red-600 font-medium shadow-sm hover:shadow-md transition-all duration-150 flex items-center gap-1.5 border border-red-400/20">
                            <i class='bx bxs-file-pdf text-sm'></i> PDF
                        </button>
                        <button type="button" onclick="generarEXCEL()" class="px-3 py-1.5 text-xs rounded-lg bg-gradient-to-r from-emerald-600 to-emerald-500 text-white hover:from-emerald-700 hover:to-emerald-600 font-medium shadow-sm hover:shadow-md transition-all duration-150 flex items-center gap-1.5 border border-emerald-400/20">
                            <i class='bx bx-grid-alt text-sm'></i> Excel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 w-full flex-1 overflow-hidden flex flex-col">
            <div class="w-full flex-1 overflow-auto min-h-0">
                <div id="auxDetalle"></div>
            </div>
            <div id="resumenAux" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2 p-2 bg-aq-surface-2 rounded-lg text-xs">
                <div><span class="text-aq-text font-medium">Total Entradas:</span> <span id="resumenTotalEntradas" class="text-green-600 font-semibold">0</span></div>
                <div><span class="text-aq-text font-medium">Total Salidas:</span> <span id="resumenTotalSalidas" class="text-red-600 font-semibold">0</span></div>
                <div><span class="text-aq-text font-medium">Registros:</span> <span id="resumenRegistros" class="font-semibold">0</span></div>
                <div><span class="text-aq-text font-medium">Saldo Final:</span> <span id="resumenSaldoFinal" class="text-blue-600 font-bold">0</span></div>
            </div>
        </div>
    </div>
</div>



{% endblock %}
{% block extra_js %}
    <script src="{% static 'js/modulos/inventario/informes/aux_existencia_articulo.js' %}" data-url="{% url 'inventario:inventario_informe_aux_existencia_articulo' %}"></script>
{% endblock %}
